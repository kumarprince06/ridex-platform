spring:
  application:
    name: ridex-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ridex_platform
    username: ridex_app
    # password: 'RidexApp@2026#Local'
    password: ${RIDEX_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

app:
  jwt:
    secret: ${RIDEX_JWT_SECRET:change-me-please-very-long-secret-key}
    access-expiration-ms: 3600000
    refresh-expiration-ms: 604800000

  google:
    maps:
      api-key: ${GOOGLE_MAPS_API_KEY:AIzaSyB7WJvf4jDgXugNxOkJGQK0Z-1QJ_xlikE}

  # Local development points at Mailpit, which accepts any sender and delivers nothing onward,
  # so a wrong address can never reach a real person. Split this into a prod profile when a
  # second environment exists - a placeholder prod block nobody runs would only rot.
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false