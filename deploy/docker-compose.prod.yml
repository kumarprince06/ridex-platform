# The demo deployment: one host, four containers, no managed services.
#
# Separate from the repo's docker-compose.yml, which is a development file - it exposes Postgres on
# the host, has no reverse proxy, and runs Mailpit. Reusing it in production would publish the
# database to the internet.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d

name: ridex

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-kumarprince06/ridex-platform}/ridex-backend:${RIDEX_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Everything the app refuses to start without, from the host rather than a file in the repo.
      RIDEX_APP_PASSWORD: ${RIDEX_APP_PASSWORD:?set it in .env.production}
      RIDEX_JWT_SECRET: ${RIDEX_JWT_SECRET:?set it in .env.production}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ridex_platform
      SPRING_DATA_REDIS_HOST: redis
      RIDEX_CORS_ALLOWED_ORIGINS: ${RIDEX_CORS_ALLOWED_ORIGINS}
      RIDEX_BOOTSTRAP_ADMIN_EMAIL: ${RIDEX_BOOTSTRAP_ADMIN_EMAIL}
      RIDEX_BOOTSTRAP_ADMIN_PASSWORD: ${RIDEX_BOOTSTRAP_ADMIN_PASSWORD}
      RIDEX_MAIL_HOST: ${RIDEX_MAIL_HOST}
      RIDEX_MAIL_PORT: ${RIDEX_MAIL_PORT}
      RIDEX_MAIL_USERNAME: ${RIDEX_MAIL_USERNAME}
      RIDEX_MAIL_PASSWORD: ${RIDEX_MAIL_PASSWORD}
      RIDEX_MAIL_FROM: ${RIDEX_MAIL_FROM}
      # Hosted relays want both; the app defaults them off for Mailpit.
      RIDEX_MAIL_AUTH: ${RIDEX_MAIL_AUTH:-true}
      RIDEX_MAIL_STARTTLS: ${RIDEX_MAIL_STARTTLS:-true}
      RIDEX_DOCUMENTS_DIR: /var/ridex/documents
      # Test keys on purpose: checkout opens, the test card works, nobody is ever charged.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      ORS_API_KEY: ${ORS_API_KEY}
    # Driver KYC uploads live on disk; without a volume every redeploy deletes them.
    volumes:
      - documents:/var/ridex/documents
    # No ports. Caddy is the only way in, so the API cannot be reached over plain HTTP.
    expose:
      - "8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ridex_platform
      POSTGRES_USER: ridex_app
      POSTGRES_PASSWORD: ${RIDEX_APP_PASSWORD:?set it in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridex_app -d ridex_platform"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Presence and rate limits only, and both are worthless within a minute. Losing this on a
    # restart costs the last few driver pings; persisting it costs a disk write per ping.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy gets a certificate from Let's Encrypt on first boot and renews it on its own. This is
    # the entire HTTPS setup - there is no certbot cron and no renewal to forget.
    ports:
      - "80:80"
      - "443:443"
    environment:
      RIDEX_API_DOMAIN: ${RIDEX_API_DOMAIN:?set it in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  documents:
  caddy_data:
  caddy_config:
