spring:
  application:
    name: ridex-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ridex_platform
    username: ridex_app
    password: ${RIDEX_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${RIDEX_REDIS_HOST:localhost}
      port: ${RIDEX_REDIS_PORT:6379}
      timeout: 500ms

app:
  jwt:
    # No default. The app refuses to start without a real key rather than signing tokens with a
    # value that is published in this repository's history.
    secret: ${RIDEX_JWT_SECRET}
    # 15 minutes. Refresh rotation makes a short access token cheap, and it bounds how long a
    # leaked one is useful - there is no revocation before expiry.
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000

  # Fixed windows, counted in Redis. Two dimensions: an IP cannot hammer the auth routes, and one
  # account cannot be brute forced from many IPs.
  rate-limit:
    ip-requests: 30
    ip-window: 1m
    login-failures: 8
    login-window: 15m

  # Comma-separated. The console in development; the deployed console origin in every
  # other environment.
  cors:
    allowed-origins: ${RIDEX_CORS_ALLOWED_ORIGINS:http://localhost:5174}

  google:
    maps:
      # No default. A key committed here is a key someone else can bill, and the previous one
      # is already in git history and must be treated as burned.
      api-key: ${GOOGLE_MAPS_API_KEY:}

  # Local development points at Mailpit, which accepts any sender and delivers nothing onward,
  # so a wrong address can never reach a real person. Split this into a prod profile when a
  # second environment exists - a placeholder prod block nobody runs would only rot.
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false