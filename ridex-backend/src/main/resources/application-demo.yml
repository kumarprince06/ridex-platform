# The public reviewer demo. Seeds the reviewer accounts if missing; never drops or resets data.
app:
  demo:
    # Published in the README, so it protects nothing; overridable so a private demo can change it.
    password: ${RIDEX_DEMO_PASSWORD:Ridex@123}

  # One reviewer plays rider and driver in Swagger, swapping tokens between steps. Twenty seconds
  # to accept is a phone in a hand; here it would expire every offer before anyone could answer it.
  dispatch:
    offer-validity: 5m
    search-timeout-seconds: 900

  # The seeder creates the demo's super admin; blanking these stops a stray env var adding another.
  bootstrap:
    admin-email: ""
    admin-password: ""

  # Every API route, not just the auth ones: anyone can sign in here, so booking and accepting
  # rides are as open to a flood as login is.
  rate-limit:
    ip-paths: /api/v1/
