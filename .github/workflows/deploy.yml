name: Deploy

# Only from main, and only after CI has passed on it: a deployment that races the test suite is a
# deployment that can ship a red build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # For redeploying the same commit after a host change, without an empty commit.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU lets the x86 runner build the arm64 image too: Oracle's Always Free host is ARM.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ridex-backend
          push: true
          platforms: linux/amd64,linux/arm64
          # Tagged with the commit as well as latest, so a bad deploy can be rolled back to a
          # specific build rather than to "whatever latest was yesterday".
          tags: |
            ghcr.io/${{ github.repository }}/ridex-backend:latest
            ghcr.io/${{ github.repository }}/ridex-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  host:
    needs: image
    runs-on: ubuntu-latest
    # Skipped until the host exists: the secrets are what switch this on, so the workflow can live
    # in the repository before there is anywhere to deploy to.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/ridex-platform/deploy
            echo "RIDEX_TAG=${{ github.sha }}" > .env.tag
            docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.tag pull backend
            docker compose -f docker-compose.prod.yml --env-file .env.production --env-file .env.tag up -d
            # Flyway runs at boot, so the schema ships with the code. Waiting on the health check
            # means a migration that fails fails the deployment rather than quietly staying down.
            for attempt in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "up after ${attempt}0s"; exit 0
              fi
              sleep 10
            done
            echo "backend did not come up"; docker compose -f docker-compose.prod.yml logs --tail 50 backend; exit 1
